<style>.video-thumbnail{
    position:relative;
    cursor:pointer;
    overflow:hidden;
    border-radius:12px;
}

.video-thumbnail img{
    width:100%;
    display:block;
}

.video-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
}

.play-button{
    font-size:60px;
    margin-bottom:10px;
}

.video-modal{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.85);
}

.video-modal-content{
    position:relative;
    width:90%;
    max-width:1100px;
    margin:5vh auto;
}

.video-modal-content iframe{
    width:100%;
    height:70vh;
    border:none;
}

.close-video{
    position:absolute;
    top:-40px;
    right:0;
    color:#fff;
    font-size:40px;
    cursor:pointer;
}</style>


<!-- THUMBNAIL DO VÍDEO -->
<div class="video-thumbnail" onclick="openVideoModal()">

    <img
        src="https://img.youtube.com/vi/fBj7-mOCtAA/maxresdefault.jpg"
        alt="Vídeo de Apresentação">

    <div class="video-overlay">

        <div class="play-button">▶</div>

        <div class="video-info">
            <h3>Vídeo de Apresentação</h3>
            <p>Clique para assistir</p>
        </div>

    </div>

</div>

<!-- MODAL -->
<div id="videoModal" class="video-modal">

    <div class="video-modal-content">

        <span class="close-video" onclick="closeVideoModal()">
            &times;
        </span>

        <iframe
            id="youtubePlayer"
            src=""
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

</div>

<script>

function openVideoModal() {

    document.getElementById("videoModal").style.display = "block";

    document.getElementById("youtubePlayer").src =
        "https://www.youtube.com/embed/fBj7-mOCtAA?autoplay=1";
}

function closeVideoModal() {

    document.getElementById("videoModal").style.display = "none";

    document.getElementById("youtubePlayer").src = "";
}

window.onclick = function(event) {

    const modal = document.getElementById("videoModal");

    if(event.target === modal){
        closeVideoModal();
    }
};

</script>
