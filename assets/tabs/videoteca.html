<style>.video-thumbnail{
    position:relative;
    cursor:pointer;
    overflow:hidden;
    border-radius:12px;
}

.video-thumbnail img{
    width:100%;
    display:block;
}

.video-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
}

.play-button{
    font-size:60px;
    margin-bottom:10px;
}

.video-modal{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.85);
}

.video-modal-content{
    position:relative;
    width:90%;
    max-width:1100px;
    margin:5vh auto;
}

.video-modal-content iframe{
    width:100%;
    height:70vh;
    border:none;
}

.close-video{
    position:absolute;
    top:-40px;
    right:0;
    color:#fff;
    font-size:40px;
    cursor:pointer;
}</style>


<div style="max-width:800px;margin:auto;">

    <img
        src="https://img.youtube.com/vi/fBj7-mOCtAA/maxresdefault.jpg"
        style="width:100%;cursor:pointer;border-radius:12px;"
        onclick="openVideoModal()">

</div>

<div id="videoModal"
     style="
     display:none;
     position:fixed;
     inset:0;
     background:rgba(0,0,0,.85);
     z-index:99999;">

    <span
        onclick="closeVideoModal()"
        style="
        position:absolute;
        top:20px;
        right:30px;
        color:white;
        font-size:50px;
        cursor:pointer;">
        ×
    </span>

    <iframe
        id="youtubePlayer"
        style="
        width:90%;
        max-width:1200px;
        height:80vh;
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        border:none;">
    </iframe>

</div>

<script> function openVideoModal() { document.getElementById("videoModal").style.display = "block"; document.getElementById("youtubePlayer").src = "https://www.youtube.com/embed/fBj7-mOCtAA?autoplay=1"; } function closeVideoModal() { document.getElementById("videoModal").style.display = "none"; document.getElementById("youtubePlayer").src = ""; } window.onclick = function(event) { const modal = document.getElementById("videoModal"); if(event.target === modal){ closeVideoModal(); } }; </script>
